<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 1160" role="img" aria-labelledby="title desc">
  <title id="title">Hybrid and multi-cloud connectivity reference architecture</title>
  <desc id="desc">A reference topology connecting China data centers and cloud environments to GCP and Azure regions, with primary and backup paths, two Azure links, and a Beijing interconnection node between Tencent Cloud and Volcano Engine.</desc>
  <defs>
    <marker id="arrow-brown" viewBox="0 0 10 10" refX="5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#8a6d5c" />
    </marker>
    <marker id="arrow-blue" viewBox="0 0 10 10" refX="5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#5279a7" />
    </marker>
    <marker id="arrow-purple" viewBox="0 0 10 10" refX="5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#796e9b" />
    </marker>
    <style>
      text { font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
      .title { fill: #24211f; font-size: 34px; font-weight: 700; letter-spacing: -0.7px; }
      .subtitle { fill: #746d68; font-size: 19px; }
      .column { fill: #8a6d5c; font-size: 14px; font-weight: 700; letter-spacing: 1.5px; }
      .node-label { fill: #282421; font-size: 22px; font-weight: 650; }
      .node-detail { fill: #77716c; font-size: 16px; }
      .route-label { fill: #49433e; font-size: 16px; font-weight: 650; }
      .small { fill: #746d68; font-size: 15px; }
    </style>
  </defs>

  <rect width="1600" height="1160" rx="26" fill="#f7f8fa" />
  <rect x="1" y="1" width="1598" height="1158" rx="25" fill="none" stroke="#e7e8ea" stroke-width="2" />

  <text x="72" y="78" class="title">Hybrid &amp; Multi-Cloud Connectivity</text>
  <text x="72" y="116" class="subtitle">Connect China-based infrastructure with cloud regions in China and overseas</text>
  <g transform="translate(1250 51)">
    <rect width="278" height="42" rx="21" fill="#f1eae4" />
    <circle cx="22" cy="21" r="5" fill="#8a6d5c" />
    <text x="38" y="27" fill="#6f5647" font-size="14" font-weight="700" letter-spacing="1">REFERENCE ARCHITECTURE</text>
  </g>

  <text x="88" y="174" class="column">SOURCE ENVIRONMENTS</text>
  <text x="710" y="174" class="column">CONNECTIVITY PATHS</text>
  <text x="1193" y="174" class="column">DESTINATION ENVIRONMENTS</text>

  <rect x="64" y="198" width="390" height="814" rx="20" fill="#fbfaf9" />
  <rect x="526" y="198" width="548" height="814" rx="20" fill="#fafbfc" />
  <rect x="1146" y="198" width="390" height="814" rx="20" fill="#fbfaf9" />

  <!-- China data center to GCP US: primary and standby paths -->
  <path d="M 415 294 C 610 245, 990 245, 1185 294" fill="none" stroke="#8a6d5c" stroke-width="4" marker-start="url(#arrow-brown)" marker-end="url(#arrow-brown)" />
  <path d="M 415 314 C 610 371, 990 371, 1185 314" fill="none" stroke="#5279a7" stroke-width="3.5" stroke-dasharray="10 9" marker-start="url(#arrow-blue)" marker-end="url(#arrow-blue)" />
  <g transform="translate(642 229)">
    <rect width="316" height="34" rx="17" fill="#f5efe8" />
    <text x="158" y="23" text-anchor="middle" class="route-label">Primary · China–US link</text>
  </g>
  <g transform="translate(662 356)">
    <rect width="276" height="34" rx="17" fill="#eef2f6" />
    <text x="138" y="23" text-anchor="middle" class="route-label">Standby · US East link</text>
  </g>

  <!-- China local data center to Azure Global via Hong Kong and Singapore -->
  <path d="M 415 528 C 510 528, 584 514, 680 514" fill="none" stroke="#8a6d5c" stroke-width="4" marker-start="url(#arrow-brown)" marker-end="url(#arrow-brown)" />
  <path d="M 900 514 C 1000 514, 1084 528, 1185 528" fill="none" stroke="#8a6d5c" stroke-width="4" marker-start="url(#arrow-brown)" marker-end="url(#arrow-brown)" />
  <path d="M 415 556 C 510 556, 584 584, 680 584" fill="none" stroke="#5279a7" stroke-width="3.5" stroke-dasharray="10 9" marker-start="url(#arrow-blue)" marker-end="url(#arrow-blue)" />
  <path d="M 900 584 C 1000 584, 1084 556, 1185 556" fill="none" stroke="#5279a7" stroke-width="3.5" stroke-dasharray="10 9" marker-start="url(#arrow-blue)" marker-end="url(#arrow-blue)" />

  <!-- Azure Beijing to Azure Singapore over two links -->
  <path d="M 415 760 C 610 729, 990 729, 1185 760" fill="none" stroke="#796e9b" stroke-width="4" marker-start="url(#arrow-purple)" marker-end="url(#arrow-purple)" />
  <path d="M 415 780 C 610 811, 990 811, 1185 780" fill="none" stroke="#796e9b" stroke-width="4" marker-start="url(#arrow-purple)" marker-end="url(#arrow-purple)" />
  <g transform="translate(700 712)">
    <rect width="160" height="34" rx="17" fill="#f1eff6" />
    <text x="80" y="23" text-anchor="middle" class="route-label">Link 1</text>
  </g>
  <g transform="translate(700 794)">
    <rect width="160" height="34" rx="17" fill="#f1eff6" />
    <text x="80" y="23" text-anchor="middle" class="route-label">Link 2</text>
  </g>

  <!-- Tencent Cloud to Volcano Engine through a Beijing node -->
  <path d="M 415 953 C 505 953, 590 953, 680 953" fill="none" stroke="#8a6d5c" stroke-width="4" marker-start="url(#arrow-brown)" marker-end="url(#arrow-brown)" />
  <path d="M 900 953 C 990 953, 1090 953, 1185 953" fill="none" stroke="#8a6d5c" stroke-width="4" marker-start="url(#arrow-brown)" marker-end="url(#arrow-brown)" />

  <!-- Source nodes -->
  <g>
    <rect x="95" y="267" width="320" height="72" rx="14" fill="#ffffff" stroke="#e5ddd7" stroke-width="2" />
    <circle cx="122" cy="291" r="6" fill="#8a6d5c" />
    <text x="140" y="298" class="node-label">China data center</text>
    <text x="120" y="325" class="node-detail">Private network edge</text>
  </g>
  <g>
    <rect x="95" y="506" width="320" height="72" rx="14" fill="#ffffff" stroke="#dce9e7" stroke-width="2" />
    <circle cx="122" cy="530" r="6" fill="#4b8b82" />
    <text x="140" y="537" class="node-label">Local data center</text>
    <text x="120" y="564" class="node-detail">China-based infrastructure</text>
  </g>
  <g>
    <rect x="95" y="734" width="320" height="72" rx="14" fill="#ffffff" stroke="#e4e0ee" stroke-width="2" />
    <circle cx="122" cy="758" r="6" fill="#796e9b" />
    <text x="140" y="765" class="node-label">Azure · Beijing</text>
    <text x="120" y="792" class="node-detail">China cloud region</text>
  </g>
  <g>
    <rect x="95" y="917" width="320" height="72" rx="14" fill="#ffffff" stroke="#eee3d5" stroke-width="2" />
    <circle cx="122" cy="941" r="6" fill="#b07b42" />
    <text x="140" y="948" class="node-label">Tencent Cloud</text>
    <text x="120" y="975" class="node-detail">China cloud environment</text>
  </g>

  <!-- Route labels and interconnection nodes -->
  <g>
    <rect x="680" y="488" width="220" height="52" rx="13" fill="#f1f7f6" stroke="#dce9e7" stroke-width="2" />
    <text x="790" y="520" text-anchor="middle" class="route-label">Hong Kong · Primary</text>
  </g>
  <g>
    <rect x="680" y="558" width="220" height="52" rx="13" fill="#f1f4f8" stroke="#dce2eb" stroke-width="2" />
    <text x="790" y="590" text-anchor="middle" class="route-label">Singapore · Backup</text>
  </g>
  <g>
    <rect x="680" y="917" width="220" height="72" rx="14" fill="#fbf5ed" stroke="#eee3d5" stroke-width="2" />
    <circle cx="707" cy="941" r="5" fill="#b07b42" />
    <text x="725" y="948" class="route-label">Beijing node</text>
    <text x="706" y="975" class="node-detail">Interconnection point</text>
  </g>

  <!-- Cloud and destination nodes -->
  <g>
    <rect x="1185" y="267" width="320" height="72" rx="14" fill="#ffffff" stroke="#e5ddd7" stroke-width="2" />
    <path d="M1210 292c0-7 6-13 13-13 5 0 9 3 11 7 2-1 4-2 6-2 7 0 12 5 12 12s-5 12-12 12h-25c-8 0-14-6-14-13 0-3 1-5 3-7 2-2 4-3 7-3" fill="none" stroke="#8a6d5c" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" />
    <text x="1264" y="298" class="node-label">GCP · United States</text>
    <text x="1210" y="325" class="node-detail">Public cloud region</text>
  </g>
  <g>
    <rect x="1185" y="506" width="320" height="72" rx="14" fill="#ffffff" stroke="#dce9e7" stroke-width="2" />
    <path d="M1210 531c0-7 6-13 13-13 5 0 9 3 11 7 2-1 4-2 6-2 7 0 12 5 12 12s-5 12-12 12h-25c-8 0-14-6-14-13 0-3 1-5 3-7 2-2 4-3 7-3" fill="none" stroke="#4b8b82" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" />
    <text x="1264" y="537" class="node-label">Azure · Global</text>
    <text x="1210" y="564" class="node-detail">Public cloud regions</text>
  </g>
  <g>
    <rect x="1185" y="734" width="320" height="72" rx="14" fill="#ffffff" stroke="#e4e0ee" stroke-width="2" />
    <path d="M1210 759c0-7 6-13 13-13 5 0 9 3 11 7 2-1 4-2 6-2 7 0 12 5 12 12s-5 12-12 12h-25c-8 0-14-6-14-13 0-3 1-5 3-7 2-2 4-3 7-3" fill="none" stroke="#796e9b" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" />
    <text x="1264" y="765" class="node-label">Azure · Singapore</text>
    <text x="1210" y="792" class="node-detail">Public cloud region</text>
  </g>
  <g>
    <rect x="1185" y="917" width="320" height="72" rx="14" fill="#ffffff" stroke="#eee3d5" stroke-width="2" />
    <path d="M1210 942c0-7 6-13 13-13 5 0 9 3 11 7 2-1 4-2 6-2 7 0 12 5 12 12s-5 12-12 12h-25c-8 0-14-6-14-13 0-3 1-5 3-7 2-2 4-3 7-3" fill="none" stroke="#b07b42" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" />
    <text x="1264" y="948" class="node-label">Volcano Engine</text>
    <text x="1210" y="975" class="node-detail">Cloud environment</text>
  </g>

  <g transform="translate(80 1052)">
    <path d="M0 0h58" stroke="#8a6d5c" stroke-width="4" />
    <text x="72" y="6" class="small">Primary / provisioned path</text>
    <path d="M334 0h58" stroke="#5279a7" stroke-width="4" stroke-dasharray="9 8" />
    <text x="406" y="6" class="small">Standby path</text>
    <path d="M620 -5h58M620 5h58" stroke="#796e9b" stroke-width="3.5" />
    <text x="692" y="6" class="small">Two parallel links</text>
  </g>
  <text x="80" y="1113" class="small">Illustrative topology. Route availability and design depend on provider, region, workload, and applicable requirements.</text>
</svg>
